name: Release

# Every push to main is checked (unit tests, lint) and, if that passes, released
# as vX.Y.Z with the APK attached. The version comes from scripts/next_version.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes can't pick the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_PLATFORM: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "build-tools;37.0.0"
  ANDROID_NDK: "ndk;30.0.16248370"
  ANDROID_NDK_VERSION: "30.0.16248370"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out (with tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          git fetch --tags --force
          chmod +x scripts/next_version.sh
          scripts/next_version.sh "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK platform, build tools and NDK
        run: |
          sdkmanager --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" > /dev/null
          # The package installs as platforms/android-37.0, but compileSdk = 37 looks
          # for platforms/android-37 (the dev machine has both).
          platforms="$ANDROID_HOME/platforms"
          if [[ ! -e "$platforms/android-37" ]]; then
            ln -s "$platforms/android-37.0" "$platforms/android-37"
          fi
          test -f "$platforms/android-37/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Phonon's native library is git-ignored and takes ~10 minutes to build, so it
      # is cached and rebuilt only when the build script (with its pinned commit) changes.
      - name: Restore Phonon native library
        id: phonon-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libptts_ffi.so
          key: phonon-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('tools/phonon/build-android-lib.sh') }}

      - name: Set up Rust for Android
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Phonon native library
        if: steps.phonon-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          tools/phonon/build-android-lib.sh

      - name: Install the signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::The DEBUG_KEYSTORE_BASE64 secret is missing. Without it the APK would be signed with a throwaway key and couldn't update the installed app."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Unit tests, lint and APK
        run: >
          ./gradlew --console=plain
          testDebugUnitTest lintDebug assembleDebug
          -PreadlyVersionName=${{ steps.version.outputs.version }}
          -PreadlyVersionCode=${{ steps.version.outputs.code }}

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Check the APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          expected="${{ vars.SIGNING_CERT_SHA256 }}"
          if [[ -z "$expected" ]]; then
            echo "::error::The SIGNING_CERT_SHA256 repository variable is missing, so the signature can't be checked."
            exit 1
          fi
          grep -qi "SHA-256 digest: $expected" certs.txt || {
            echo "::error::The APK isn't signed with the expected key (repository variable SIGNING_CERT_SHA256)."
            exit 1
          }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="readly-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Readly $TAG" \
            --generate-notes
